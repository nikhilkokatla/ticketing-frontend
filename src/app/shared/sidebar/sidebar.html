
<div class="sidebar">

  <div class="logo">
    <h2>Sum Positive Ticketing Tool</h2>
  </div>

  <nav>

    <!-- Common Dashboard -->
    <a routerLink="/dashboard"
       routerLinkActive="active">
      Dashboard
    </a>

    <!-- Agent Navigation -->
    @if (role === 'AGENT') {

    <a routerLink="/all-tickets"
       routerLinkActive="active">
      All Tickets
    </a>

    }

    <!-- Customer Navigation -->
    @if (role === 'CUSTOMER') {

    <a routerLink="/create-ticket"
       routerLinkActive="active">
      Create Ticket
    </a>

    <a routerLink="/my-tickets"
       routerLinkActive="active">
      My Tickets
    </a>

    }

  </nav>

  <div class="logout-section">
    <button (click)="logout()">
      Logout
    </button>
  </div>

</div>
